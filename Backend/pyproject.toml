[tool.pytest.ini_options]
testpaths = ["tests", "routing/tests"]
pythonpath = ["."]
markers = [
    "integration: needs the MQTT broker running (docker compose up). Skipped if it is not reachable.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
# Lenient to start with. Tighten later.
ignore_missing_imports = true
