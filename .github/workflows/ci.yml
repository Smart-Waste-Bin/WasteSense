name: CI

on:
  push:
  pull_request:

# Python code lives in Backend/ (Backend/routing and Backend/simulator are inside it).

jobs:
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check Backend/
      - name: ruff format --check
        run: ruff format --check Backend/

  typecheck-python:
    name: typecheck-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: pip install -r Backend/requirements.txt -r Backend/requirements-dev.txt
      - name: mypy (config in Backend/pyproject.toml)
        working-directory: Backend
        run: mypy .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start db, mqtt and backend
        run: docker compose up -d --build --wait
      - name: Run tests with coverage (Backend/tests and Backend/routing/tests, MQTT tests included)
        run: >
          docker compose exec -T -e MQTT_TESTS_REQUIRED=1 backend
          pytest -v --cov=app --cov=routing --cov-report=term-missing
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for Backend/alembic
        id: check
        run: |
          if [ -d Backend/alembic ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Backend/alembic yet, skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the CI database and backend
        if: steps.check.outputs.found == 'true'
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: alembic upgrade head, then alembic check
        if: steps.check.outputs.found == 'true'
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend alembic check
      - name: Stop the stack
        if: always() && steps.check.outputs.found == 'true'
        run: docker compose down -v

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build backend

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Firmware/platformio.ini') }}
      - run: pip install platformio
      - name: pio run
        working-directory: Firmware
        run: pio run

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Web, Mobile]
    defaults:
      run:
        working-directory: Frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no frontend yet, skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.found == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/${{ matrix.app }}/package-lock.json
      - if: steps.check.outputs.found == 'true'
        run: npm ci
      - if: steps.check.outputs.found == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.found == 'true'
        run: npm run typecheck --if-present
      - if: steps.check.outputs.found == 'true'
        run: npm run test --if-present
      - name: npm run build (Web only)
        if: steps.check.outputs.found == 'true' && matrix.app == 'Web'
        run: npm run build --if-present
