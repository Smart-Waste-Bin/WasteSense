# Mosquitto config for SmartBin (mounted at /mosquitto/config in the container)

# Security: every client needs a username and password
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/mosquitto.acl

# Storage and logs
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plain MQTT. Dev only, but still needs a password.
listener 1883

# MQTT over TLS. Certs come from make-dev-certs.sh (dev only, self-signed).
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
