# Local dev stack: database, MQTT broker and backend.
# Before the first start: cp .env.example .env, then run the two scripts in
# Backend/Infra/mosquitto/ (see README "Local setup").

services:
  db:
    image: postgis/postgis:16-3.4
    # Apple Silicon Macs (M1/M2/M3/M4): this image has no arm64 build.
    # Uncomment the line below so Docker runs it under emulation (slower, but works).
    # platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # plain, dev only, password still required
      - "8883:8883"   # TLS
    volumes:
      - ./Backend/Infra/mosquitto:/mosquitto/config
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app   # live reload on code changes (includes Backend/routing)
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  mqtt-data:
