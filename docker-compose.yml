# Local dev stack: database, MQTT broker, backend and bin simulator.
# Before the first start: put the team .env in the repo root (or cp .env.example .env).
# Then `docker compose up` does the rest:
#   - mqtt-setup makes the broker's certs and passwords,
#   - the backend updates the database (alembic upgrade head) and seeds it if it is empty,
#   - the simulator sends readings for the simulated bins in real time.
# Stop only the simulator: docker compose stop simulator

services:
  db:
    image: postgis/postgis:16-3.4
    # Apple Silicon Macs (M1/M2/M3/M4): this image has no arm64 build.
    # Uncomment the line below so Docker runs it under emulation (slower, but works).
    # platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off job: makes dev certs (if missing) and the passwd file from .env, then exits.
  mqtt-setup:
    image: eclipse-mosquitto:2
    entrypoint: ["sh", "/mosquitto/config/setup.sh"]
    env_file: .env
    volumes:
      - ./Backend/Infra/mosquitto:/mosquitto/config

  mqtt:
    image: eclipse-mosquitto:2
    depends_on:
      mqtt-setup:
        condition: service_completed_successfully
    ports:
      - "1883:1883"   # plain, dev only, password still required
      - "8883:8883"   # TLS
    volumes:
      - ./Backend/Infra/mosquitto:/mosquitto/config
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    # Migrations every start (safe), seed only into an empty database, then the API.
    # A failed seed doesn't stop the API; its message says what to fix.
    command: >
      sh -c "alembic upgrade head &&
             { python -m scripts.seed --if-empty || echo 'Seed skipped, see the message above'; } &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app   # live reload on code changes (includes Backend/routing)
      - ./Docs:/Docs:ro  # Docs/contract examples, read by tests/test_contract.py
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Virtual bins (BE-06, Docs/simulator.md). Real-time speed, default scenario.
  # For a fast run use: docker compose exec backend python -m simulator.run --speed 144 --hours 24
  # (stop this one first, so two simulators don't send for the same bins).
  simulator:
    build: ./Backend
    command: python -m simulator.run --speed 1
    env_file: .env
    environment:
      SIM_API_URL: http://backend:8000
    volumes:
      - ./Backend:/app
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  mqtt-data:
